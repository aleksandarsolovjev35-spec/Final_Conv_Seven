<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка ленты</title>
<link rel="stylesheet" href="css/belt-editor.css?v=26">
</head>
<body>

<!-- Верх: видеостена. Слева — основная (входная) камера крупно,
     справа — все обнаруженные камеры ленты. -->
<div class="cameras">
    <div class="cam-main-wrap">
        <div class="zone-head">ОСНОВНАЯ КАМЕРА
            <span class="hint" id="cam-main-role"></span>
        </div>
        <div class="cam-main-box" id="cam-main-box">
            <canvas id="cam-main"></canvas>
            <span class="cam-tag cam-tag-tr" id="cam-main-time"></span>
            <span class="cam-tag cam-tag-br" id="cam-main-status"></span>
        </div>
    </div>
    <div class="cam-wall-wrap">
        <div class="zone-head">ОБНАРУЖЕННЫЕ КАМЕРЫ
            <span class="hint" id="cam-count"></span>
        </div>
        <div class="cam-wall" id="cam-wall"></div>
        <div class="assets-zone">
            <div class="zone-head">ПРАВИЛА <span class="hint" id="rule-count"></span></div>
            <div class="assets" id="asset-rules"></div>
            <div class="zone-head">МОДЕЛИ <span class="hint" id="model-count"></span></div>
            <div class="assets" id="asset-models"></div>
        </div>
    </div>
</div>

<div class="app">

    <!-- Область 1: палитра элементов -->
    <aside class="palette" id="palette">
        <div class="zone-head">ЭЛЕМЕНТЫ <span class="hint">сб. 26</span></div>

        <div class="tool" draggable="true" data-kind="position">
            <b>Позиция</b>
        </div>
        <div class="tool" draggable="true" data-kind="inspect">
            <b>Место инспекции</b>
        </div>
        <div class="tool" draggable="true" data-kind="reset">
            <b>Точка сброса</b>
        </div>
    </aside>

    <!-- Область 2: сборка ленты -->
    <main class="build">
        <div class="zone-head">СБОРКА ЛЕНТЫ
            <span class="hint" id="belt-meta"></span>
        </div>
        <div class="belt-zone" id="belt-zone">
            <div class="belt-row" id="belt-row"></div>
        </div>
    </main>

</div>

<div id="toasts" class="toasts"></div>

<script src="js/builder.js?v=26"></script>
<script src="js/belt-view.js?v=26"></script>
<script src="js/cameras.js?v=26"></script>
</body>
</html>
