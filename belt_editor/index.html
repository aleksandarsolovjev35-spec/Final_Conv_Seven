<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка ленты</title>
<link rel="stylesheet" href="css/belt-editor.css?v=6">
</head>
<body>

<div class="app">

    <!-- Область 1: палитра элементов -->
    <aside class="palette" id="palette">
        <div class="zone-head">ЭЛЕМЕНТЫ <span class="hint">сб. 6</span></div>

        <div class="tool" draggable="true" data-kind="position">
            <b>Позиция</b>
        </div>
        <div class="tool" draggable="true" data-kind="inspect">
            <b>Место инспекции</b>
        </div>
        <div class="tool" draggable="true" data-kind="camera">
            <b>Камера</b>
        </div>
        <div class="tool" draggable="true" data-kind="reset">
            <b>Точка сброса</b>
        </div>
    </aside>

    <!-- Область 2: сборка ленты -->
    <main class="build">
        <div class="zone-head">СБОРКА ЛЕНТЫ
            <span class="hint" id="belt-meta"></span>
        </div>
        <div class="belt-zone" id="belt-zone">
            <div class="belt-row" id="belt-row"></div>
        </div>
    </main>

</div>

<div id="toasts" class="toasts"></div>

<script src="js/builder.js?v=6"></script>
</body>
</html>
