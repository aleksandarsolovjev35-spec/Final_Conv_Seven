<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка ленты</title>
<link rel="stylesheet" href="css/belt-editor.css?v=47">
</head>
<body>

<!-- Верх: видеостена. Слева — основная (входная) камера крупно,
     справа — все обнаруженные камеры ленты. -->
<div class="cameras">
    <div class="cam-main-wrap">
        <div class="zone-head">ОСНОВНАЯ КАМЕРА
            <span class="hint" id="cam-main-role"></span>
        </div>
        <div class="cam-main-box" id="cam-main-box">
            <canvas id="cam-main"></canvas>
            <span class="cam-tag cam-tag-tr" id="cam-main-time"></span>
            <span class="cam-tag cam-tag-br" id="cam-main-status"></span>
        </div>
    </div>
    <div class="cam-wall-wrap">
        <div class="zone-head">ОБНАРУЖЕННЫЕ КАМЕРЫ
            <span class="hint" id="cam-count"></span>
        </div>
        <div class="cam-wall" id="cam-wall"></div>
        <div class="assets-zone">
            <div class="assets-col">
                <div class="zone-head">ПРАВИЛА
                    <span class="hint" id="rule-count"></span>
                </div>
                <label class="search">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="6.5" cy="6.5" r="4.4"/>
                        <path d="M9.9 9.9 14 14"/>
                    </svg>
                    <input id="rule-search" type="text" placeholder="поиск"
                        autocomplete="off">
                </label>
                <div class="assets" id="asset-rules"></div>
            </div>
            <div class="assets-col">
                <div class="zone-head">МОДЕЛИ
                    <span class="hint" id="model-count"></span>
                </div>
                <label class="search">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="6.5" cy="6.5" r="4.4"/>
                        <path d="M9.9 9.9 14 14"/>
                    </svg>
                    <input id="model-search" type="text" placeholder="поиск"
                        autocomplete="off">
                </label>
                <div class="assets" id="asset-models"></div>
            </div>
        </div>
    </div>
</div>

<div class="app">

    <!-- Сборка ленты: инструменты — плавающие иконки в углу -->
    <main class="build">
        <div class="zone-head">СБОРКА ЛЕНТЫ
            <span class="hint" id="belt-meta"></span>
            <span class="hint">сб. 47</span>
        </div>
        <div class="belt-zone" id="belt-zone">
            <div class="tools">
                <span class="tool" draggable="true" data-kind="position">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M1.5 4.5h13"/>
                        <path d="M1.5 4.5V2.8M14.5 4.5V2.8"/>
                        <path d="M2.8 4.5v6.3c0 1 .8 1.7 1.7 1.7h7
                            c1 0 1.7-.8 1.7-1.7V4.5"/>
                    </svg>
                </span>
                <span class="tool" draggable="true" data-kind="inspect">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <rect x="1.5" y="4.5" width="13" height="9"
                            rx="1.5"/>
                        <circle cx="8" cy="9" r="2.4"/>
                        <path d="M6 4.5V3h4v1.5"/>
                    </svg>
                </span>
                <span class="tool" draggable="true" data-kind="reset">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 1.5v7.5M5 6.5l3 3 3-3"/>
                        <path d="M2.5 13.5h11"/>
                    </svg>
                </span>
            </div>
            <div class="belt-row" id="belt-row"></div>
        </div>
    </main>

</div>

<div id="toasts" class="toasts"></div>

<script src="js/builder.js?v=47"></script>
<script src="js/belt-view.js?v=47"></script>
<script src="js/cameras.js?v=47"></script>
</body>
</html>
