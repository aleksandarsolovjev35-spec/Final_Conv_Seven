<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка ленты</title>
    <link rel="stylesheet" href="css/belt-editor.css?v=129">
</head>
<body>
<script>
window.addEventListener('error', function (e) {
    console.error('BeltEditor error:', e.message, e.filename, e.lineno);
    try {
        new Image().src = '/client-error?msg=' + encodeURIComponent(e.message + ' at ' + (e.filename || '') + ':' + e.lineno);
    } catch (ign) {}
});
</script>

<!-- Верхняя половина (50% высоты экрана): видеостена на всю ширину.
     Слева — основная камера, справа — обнаруженные камеры. -->
<div class="cameras">
    <div class="cam-main-wrap">
        <div class="zone-head">ОСНОВНАЯ КАМЕРА
            <span class="hint" id="cam-main-role"></span>
        </div>
        <div class="cam-main-box" id="cam-main-box">
            <canvas id="cam-main"></canvas>
            <span class="cam-tag cam-tag-tr" id="cam-main-time"></span>
            <span class="cam-tag cam-tag-br" id="cam-main-status"></span>
        </div>
    </div>
    <div class="cam-wall-wrap">
        <div class="zone-head">ОБНАРУЖЕННЫЕ КАМЕРЫ
            <span class="hint" id="cam-count"></span>
        </div>
        <div class="cam-wall" id="cam-wall"></div>
    </div>
</div>

<!-- Нижняя половина (50% высоты экрана): сборка ленты на всю ширину.
     Внутри сборки справа размещена панель с правилами и моделями. -->
<div class="app">
    <main class="build">
        <div class="zone-head">СБОРКА ЛЕНТЫ
            <span class="hint" id="belt-meta"></span>
            <div class="belt-run-ctrl" id="belt-run-ctrl">
                <span class="belt-run-badge locked" id="belt-run-status">П0: НЕТ КАМЕРЫ (ПУСК ЗАБЛОКИРОВАН)</span>
                <button type="button" class="btn-belt-run disabled" id="btn-belt-run" title="Нельзя запустить ленту: на первой позиции (П0) нет камеры инспекции">ПУСК ЛЕНТЫ</button>
            </div>
            <span class="hint">сб. 104</span>
        </div>
        <div class="build-body">
            <div class="belt-zone" id="belt-zone">
                <div class="tools tools-left" title="Инструменты конвейера">
                    <span class="tool" draggable="true" data-kind="position" title="Позиция ленты">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="4" y="2" width="8" height="7"/>
                            <path d="M1.5 13h13"/>
                        </svg>
                    </span>
                    <span class="tool" draggable="true" data-kind="inspect" title="Инспекция">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="1.5" y="4.5" width="13" height="9"
                                rx="1.5"/>
                            <circle cx="8" cy="9" r="2.4"/>
                            <path d="M6 4.5V3h4v1.5"/>
                        </svg>
                    </span>
                    <span class="tool" draggable="true" data-kind="reset" title="Сброс детали">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M8 1.5v7.5M5 6.5l3 3 3-3"/>
                            <path d="M2.5 13.5h11"/>
                        </svg>
                    </span>
                </div>

                <!-- Правая палитра: готовые инструменты инспекции («Замер», «Наличие») и лаборатория -->
                <div class="tools tools-right" id="tools-inspect" title="Инструменты инспекции">
                    <span class="tool tool-rule" draggable="true" data-kind="rule" data-rule="r0" title="Инструмент: Замер (линейные размеры и допуски)" style="color: #d9a441;">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M2 3h12v2H2zM2 11h12v2H2zM4 5v6M12 5v6M8 6v4" stroke="currentColor" fill="none" stroke-width="1.2"/>
                        </svg>
                    </span>
                    <span class="tool tool-rule" draggable="true" data-kind="rule" data-rule="r1" title="Инструмент: Наличие (комплектность деталей)" style="color: #58b79a;">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="3" y="3" width="4" height="4" fill="currentColor"/>
                            <rect x="9" y="3" width="4" height="4" fill="currentColor"/>
                            <rect x="3" y="9" width="4" height="4" fill="currentColor"/>
                            <rect x="9" y="9" width="4" height="4" fill="currentColor"/>
                        </svg>
                    </span>
                    <span class="tool tool-rule" draggable="true" data-kind="rule" data-rule="r2" title="Инструмент: Запрет (брак при наличии)" style="color: #cf7aa6;">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
                            <line x1="3.5" y1="3.5" x2="12.5" y2="12.5" stroke="currentColor" stroke-width="1.4"/>
                        </svg>
                    </span>
                    <span class="tool tool-rule" draggable="true" data-kind="rule" data-rule="r3" title="Инструмент: Смещение" style="color: #a58ad9; display: none;" aria-hidden="true">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <circle cx="9" cy="7" r="1.8" fill="currentColor"/>
                            <path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3" stroke="currentColor" stroke-width="1.2"/>
                        </svg>
                    </span>
                </div>
                <div class="belt-row" id="belt-row"></div>
                <svg id="wires" aria-hidden="true"></svg>
            </div>

            <!-- Боковой док скрыт во избежание двоения интерфейса (модели выбираются в карточке, инструменты на поле) -->
            <aside class="side-dock show-models" id="side-dock" style="display: none !important;" aria-hidden="true">
                <div class="side-dock-head">
                    <div class="side-dock-tabs" role="tablist">
                        <button type="button" class="side-dock-tab-btn" id="tab-btn-rules" data-tab="rules" role="tab" aria-selected="false" style="display: none;" aria-hidden="true">ИНСТРУМЕНТЫ</button>
                        <button type="button" class="side-dock-tab-btn active" id="tab-btn-models" data-tab="models" role="tab" aria-selected="true" style="display: none;" aria-hidden="true">МОДЕЛИ</button>
                        <span class="side-dock-title" id="side-dock-title">МОДЕЛИ НЕЙРОСЕТЕЙ</span>
                    </div>
                    <button type="button" class="side-dock-collapse" id="btn-side-collapse" title="Свернуть боковую панель">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M6 3l5 5-5 5"/>
                        </svg>
                    </button>
                </div>

                <div class="side-dock-body">
                    <section class="ps-panel" id="ps-panel-rules" style="display: none !important;" aria-hidden="true">
                        <div class="ps-panel-head">
                            <span class="ps-panel-title">ИНСТРУМЕНТЫ</span>
                            <span class="hint" id="rule-count"></span>
                        </div>
                        <div class="ps-panel-content">
                            <label class="search">
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <circle cx="6.5" cy="6.5" r="4.4"/>
                                    <path d="M9.9 9.9 14 14"/>
                                </svg>
                                <input id="rule-search" type="text" placeholder="поиск инструментов..."
                                    autocomplete="off">
                            </label>
                            <div class="assets" id="asset-rules"></div>
                            <div class="folder-bar" title="Папка с .py файлами инструментов">
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.5l1.5 2H13a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12.5v-9z"/>
                                </svg>
                                <input type="text" id="rule-folder-path" class="folder-input"
                                    placeholder="папка файлов инструментов..." autocomplete="off">
                                <button type="button" class="btn-folder" id="btn-rule-folder" title="Выбрать папку с диска">Обзор</button>
                                <input type="file" id="rule-folder-input" webkitdirectory directory multiple style="display:none">
                            </div>
                        </div>
                    </section>

                    <div class="ps-panel-divider" style="display: none !important;"></div>

                    <section class="ps-panel" id="ps-panel-models">
                        <div class="ps-panel-head">
                            <span class="ps-panel-title">МОДЕЛИ</span>
                            <span class="hint" id="model-count"></span>
                        </div>
                        <div class="ps-panel-content">
                            <label class="search">
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <circle cx="6.5" cy="6.5" r="4.4"/>
                                    <path d="M9.9 9.9 14 14"/>
                                </svg>
                                <input id="model-search" type="text" placeholder="поиск"
                                    autocomplete="off">
                            </label>
                            <div class="assets" id="asset-models"></div>
                            <div class="folder-bar" title="Папка с весами моделей">
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.5l1.5 2H13a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12.5v-9z"/>
                                </svg>
                                <input type="text" id="model-folder-path" class="folder-input"
                                    placeholder="папка весов (.pt, .onnx)..." autocomplete="off">
                                <button type="button" class="btn-folder" id="btn-model-folder" title="Выбрать папку с диска">Обзор</button>
                                <input type="file" id="model-folder-input" webkitdirectory directory multiple style="display:none">
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Свёрнутая боковая панель (мини-док Photoshop) -->
                <div class="side-dock-collapsed-bar" id="side-dock-collapsed-bar" title="Развернуть боковую панель">
                    <button type="button" class="side-dock-expand" id="btn-side-expand" title="Развернуть боковую панель">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M10 3L5 8l5 5"/>
                        </svg>
                    </button>
                    <div class="side-dock-tab" data-panel="rules" style="display: none;" aria-hidden="true">И</div>
                    <div class="side-dock-tab active" data-panel="models" title="Модели нейросетей">М</div>
                </div>
            </aside>
        </div>
    </main>
</div>

<div id="toasts" class="toasts"></div>

<script src="js/cameras.js?v=129"></script>
    <script src="js/belt-view.js?v=129"></script>
    <script src="js/builder.js?v=129"></script>
</body>
</html>
